# Unit tests and a debug build on every pull request to main, before a merge triggers a release.
name: PR check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      BUILD_TOOLS_VERSION: "37.0.0"
      PLATFORM: "platforms;android-37.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "$PLATFORM" "build-tools;$BUILD_TOOLS_VERSION" > /dev/null

      - name: Unit tests and debug build
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug
